<!DOCTYPE html>
<html>
<head>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f8f9fa; /* Light Google-style grey */
            overflow: hidden;
        }

        /* Full screen centering container */
        #loader-container {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            width: 100vw;
            transition: opacity 0.5s ease;
        }

        /* Modern CSS Spinner */
        .spinner {
            width: 50px;
            height: 50px;
            border: 5px solid #e0e0e0;
            border-top: 5px solid #4285F4; /* Google Blue */
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .loading-text {
            color: #5f6368;
            font-size: 18px;
            font-weight: 500;
        }

        /* Class to hide the loader when picker is ready */
        .hidden {
            opacity: 0;
            pointer-events: none;
        }
    </style>
    <script src="https://apis.google.com/js/api.js"></script>
    <script>
// Get both token and key from URL
const urlParams = new URLSearchParams(window.location.search);
const token = urlParams.get('token');
const devKey = urlParams.get('key'); // Read the key dynamically

function loadPicker() {
    if (!devKey || !token) {
        console.error("Missing credentials in URL");
        return;
    }
    
    gapi.load('picker', { 'callback': () => {
         // 1. Create a single view for folders. 
                        // We do NOT call setEnableDrives(true) here because that often 
                        // forces the view to show ONLY Shared Drives.
                        const view = new google.picker.DocsView(google.picker.ViewId.FOLDERS)
                            .setIncludeFolders(true)
                            .setSelectFolderEnabled(true);
                
                        const picker = new google.picker.PickerBuilder()
                            .setTitle("Select a Folder")
                            .addView(view)
                            // 2. CRITICAL: Enable the sidebar navigation for all drive types
                            .enableFeature(google.picker.Feature.SUPPORT_DRIVES) 
                            .setOAuthToken(token)
                            .setDeveloperKey(devKey)
                            .setOrigin(window.location.origin)
                            .setCallback(pickerCallback)
                            .build();
                            
                        picker.setVisible(true);
        
        // Hide the loading spinner
        setTimeout(() => {
            document.getElementById('loader-container').classList.add('hidden');
        }, 300);
    }});
}

       function pickerCallback(data) {
            if (data.action === google.picker.Action.PICKED) {
                const doc = data.docs[0];
                
                window.postMessage({
                    source: 'DRIVE_PICKER_PAGE',
                    type: 'PICKER_RESULT',
                    folderId: doc.id,
                    folderName: doc.name,
                    // Even if driveId is missing, we flag it as a potential shared item
                    isShared: doc.isShared || false 
                }, "*"); 
        
                setTimeout(() => window.close(), 500);
            }
        }
        window.onload = loadPicker;
    </script>
</head>
<body>
    <div id="loader-container">
        <div class="spinner"></div>
        <div class="loading-text">Authenticating with Google Drive...</div>
    </div>
