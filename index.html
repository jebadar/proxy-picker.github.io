<!DOCTYPE html>
<html>
<head>
    <script src="https://apis.google.com/js/api.js"></script>
    <script>
        // Get token from URL
        const urlParams = new URLSearchParams(window.location.search);
        const token = urlParams.get('token');
        const devKey = 'AIzaSyAAFDzSHl05ry2YRXTYnsjMn83G31yji-4'; // Your actual key

                function loadPicker() {
            console.log("window.location.origin",window.location.origin)
    gapi.load('picker', { 'callback': () => {
        const picker = new google.picker.PickerBuilder()
            .addView(google.picker.ViewId.FOLDERS)
            .setOAuthToken(token)
            .setDeveloperKey(devKey)
            // Use window.location.origin to ensure it matches exactly what the browser sees
            .setOrigin(window.location.origin) 
            .setCallback(pickerCallback)
            .build();
        picker.setVisible(true);
    }});
}

        function pickerCallback(data) {
            if (data.action === google.picker.Action.PICKED) {
                window.opener.postMessage({
                    type: 'PICKER_RESULT',
                    doc: data.docs[0]
                }, '*');
                window.close();
            } else if (data.action === google.picker.Action.CANCEL) {
                window.opener.postMessage({
                    type: 'PICKER_CANCELLED'
                }, '*');
                window.close();
            }
        }
        window.onload = loadPicker;
    </script>
</head>
<body>
    <h3>Loading Google Drive Picker...</h3>
</body>
</html>
