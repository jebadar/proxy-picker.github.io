<!DOCTYPE html>
<html>
<head>
    <script src="https://apis.google.com/js/api.js"></script>
    <script>
        // 1. Get token from the URL (passed by your extension)
        const urlParams = new URLSearchParams(window.location.search);
        const token = urlParams.get('token');
        const devKey = 'AIzaSy...'; // Your Developer Key

        function loadPicker() {
            gapi.load('picker', { 'callback': () => {
                const picker = new google.picker.PickerBuilder()
                    .addView(google.picker.ViewId.DOCS)
                    .setOAuthToken(token)
                    .setDeveloperKey(devKey)
                    .setOrigin('https://yourdomain.com') // MATCHES THE HOSTED DOMAIN
                    .setCallback(pickerCallback)
                    .build();
                picker.setVisible(true);
            }});
        }

        function pickerCallback(data) {
            if (data.action === google.picker.Action.PICKED) {
                // 2. Send the result back to the Extension window
                window.opener.postMessage({
                    type: 'PICKER_RESULT',
                    doc: data.docs[0]
                }, '*');
                window.close();
            }
        }
        window.onload = loadPicker;
    </script>
</head>
<body>
    <h3>Loading Google Drive Picker...</h3>
</body>
</html>
