<!DOCTYPE html>
<html>
<head>
    <script src="https://apis.google.com/js/api.js"></script>
    <script>
        // Get token from URL
        const urlParams = new URLSearchParams(window.location.search);
        const token = urlParams.get('token');
        const devKey = 'AIzaSyAAFDzSHl05ry2YRXTYnsjMn83G31yji-4'; // Your actual key

                function loadPicker() {
                    gapi.load('picker', { 'callback': () => {
                        // We create just ONE view. 
                        // DocsView(google.picker.ViewId.DOCS) is the most flexible base.
                        const view = new google.picker.DocsView(google.picker.ViewId.DOCS)
                            .setIncludeFolders(true)      // Show folders
                            .setSelectFolderEnabled(true) // Allow picking the folders
                            .setEnableDrives(true);       // This adds "Shared Drives" to the LEFT sidebar
                
                        const picker = new google.picker.PickerBuilder()
                            .setTitle("Select Destination Folder")
                            // Use only the one view to avoid redundant top tabs
                            .addView(view)
                            .setOAuthToken(token)
                            .setDeveloperKey(devKey)
                            .setOrigin(window.location.origin)
                            .setCallback(pickerCallback)
                            .build();
                        picker.setVisible(true);
                    }});
                }

        function pickerCallback(data) {
            if (data.action === google.picker.Action.PICKED) {
                window.opener.postMessage({
                    type: 'PICKER_RESULT',
                    doc: data.docs[0]
                }, '*');
                window.close();
            } else if (data.action === google.picker.Action.CANCEL) {
                window.opener.postMessage({
                    type: 'PICKER_CANCELLED'
                }, '*');
                window.close();
            }
        }
        window.onload = loadPicker;
    </script>
</head>
<body>
    <h3>Loading Google Drive Picker...</h3>
</body>
</html>
