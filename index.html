<!DOCTYPE html>
<html>
<head>
    <script src="https://apis.google.com/js/api.js"></script>
    <script>
        // Get token from URL
        const urlParams = new URLSearchParams(window.location.search);
        const token = urlParams.get('token');
        const devKey = 'AIzaSyAAFDzSHl05ry2YRXTYnsjMn83G31yji-4'; // Your actual key

        function loadPicker() {
    gapi.load('picker', { 'callback': () => {
        // 1. Create the standard My Drive view
        const driveView = new google.picker.DocsView(google.picker.ViewId.DOCS)
            .setIncludeFolders(true)
            .setSelectFolderEnabled(true)
            .setEnableDrives(true); // Enables the Shared Drives tab in the sidebar

        // 2. Create a specific Folders-only view (optional, but helps with UX)
        const folderView = new google.picker.DocsView(google.picker.ViewId.FOLDERS)
            .setIncludeFolders(true)
            .setSelectFolderEnabled(true)
            .setEnableDrives(true);

        const picker = new google.picker.PickerBuilder()
            .setTitle("Select a Folder from My Drive or Shared Drives")
            // Adding both views ensures the "My Drive" and "Shared Drives" 
            // options appear in the sidebar navigation
            .addView(driveView)
            .addView(folderView) 
            .setOAuthToken(token)
            .setDeveloperKey(devKey)
            .setOrigin(window.location.origin)
            .setCallback(pickerCallback)
            .build();
        picker.setVisible(true);
    }});
}

        function pickerCallback(data) {
            if (data.action === google.picker.Action.PICKED) {
                window.opener.postMessage({
                    type: 'PICKER_RESULT',
                    doc: data.docs[0]
                }, '*');
                window.close();
            } else if (data.action === google.picker.Action.CANCEL) {
                window.opener.postMessage({
                    type: 'PICKER_CANCELLED'
                }, '*');
                window.close();
            }
        }
        window.onload = loadPicker;
    </script>
</head>
<body>
    <h3>Loading Google Drive Picker...</h3>
</body>
</html>
