<!DOCTYPE html>
<html>
<head>
    <script src="https://apis.google.com/js/api.js"></script>
    <script>
        // Get token from URL
        const urlParams = new URLSearchParams(window.location.search);
        const token = urlParams.get('token');
        const devKey = 'AIzaSyAAFDzSHl05ry2YRXTYnsjMn83G31yji-4'; // Your actual key

        function loadPicker() {
    gapi.load('picker', { 'callback': () => {
        // We use the base DocsView but FILTER it to only show folders.
        // This is the most compatible way to use the drive.file scope.
        const view = new google.picker.DocsView(google.picker.ViewId.DOCS)
            .setIncludeFolders(true) 
            .setSelectFolderEnabled(true)
            .setMimeTypes('application/vnd.google-apps.folder') // Only show folders
            .setEnableDrives(true); // Allow Shared Drives navigation

        const picker = new google.picker.PickerBuilder()
            .setTitle("Select a Folder")
            .addView(view) 
            .setOAuthToken(token)
            .setDeveloperKey(devKey)
            .setOrigin(window.location.origin)
            .setCallback(pickerCallback)
            .build();
        picker.setVisible(true);
    }});
}

        function pickerCallback(data) {
            if (data.action === google.picker.Action.PICKED) {
                window.opener.postMessage({
                    type: 'PICKER_RESULT',
                    doc: data.docs[0]
                }, '*');
                window.close();
            } else if (data.action === google.picker.Action.CANCEL) {
                window.opener.postMessage({
                    type: 'PICKER_CANCELLED'
                }, '*');
                window.close();
            }
        }
        window.onload = loadPicker;
    </script>
</head>
<body>
    <h3>Loading Google Drive Picker...</h3>
</body>
</html>
