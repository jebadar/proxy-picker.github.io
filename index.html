<!DOCTYPE html>
<html>
<head>
    <script src="https://apis.google.com/js/api.js"></script>
    <script>
        // Get token from URL
        const urlParams = new URLSearchParams(window.location.search);
        const token = urlParams.get('token');
        const devKey = 'AIzaSyAAFDzSHl05ry2YRXTYnsjMn83G31yji-4'; // Your actual key

        function loadPicker() {
            gapi.load('picker', { 'callback': () => {
                const picker = new google.picker.PickerBuilder()
                    .addView(google.picker.ViewId.FOLDERS)
                    .addView(new google.picker.DocsView(google.picker.ViewId.DOCS)
                        .setParent('root')
                        .setIncludeFolders(true)
                        .setSelectFolderEnabled(true))
                    .setOAuthToken(token)
                    .setDeveloperKey(devKey)
                    .setOrigin('https://jebadar.github.io') // YOUR ACTUAL DOMAIN
                    .setCallback(pickerCallback)
                    .build();
                picker.setVisible(true);
            }});
        }

        function pickerCallback(data) {
            if (data.action === google.picker.Action.PICKED) {
                window.opener.postMessage({
                    type: 'PICKER_RESULT',
                    doc: data.docs[0]
                }, '*');
                window.close();
            } else if (data.action === google.picker.Action.CANCEL) {
                window.opener.postMessage({
                    type: 'PICKER_CANCELLED'
                }, '*');
                window.close();
            }
        }
        window.onload = loadPicker;
    </script>
</head>
<body>
    <h3>Loading Google Drive Picker...</h3>
</body>
</html>
